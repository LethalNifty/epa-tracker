# GI Hub's backup (worker.mjs): its own Worker, with the public address the
# phone backs up to, https://gi-hub-backup.lethalnifty.workers.dev (the account's
# workers.dev name is lethalnifty). Deploy from this folder: npx wrangler deploy
# Storage is the KV namespace BACKUPS, made once with
# npx wrangler kv namespace create BACKUPS, its id below.
name = "gi-hub-backup"
main = "worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

[[kv_namespaces]]
binding = "BACKUPS"
id = "0c5d10400d20445080af2e8ae1f17774"
