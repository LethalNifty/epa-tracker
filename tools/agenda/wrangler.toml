# GI Hub's reminder sender (worker.mjs): its own Worker, with the public
# address the phone connects to, https://gi-hub-agenda.lethalnifty.workers.dev
# (the account's workers.dev name is lethalnifty). Deploy from this folder:
# npx wrangler deploy
# Storage is the KV namespace AGENDA, made once with
# npx wrangler kv namespace create AGENDA, its id below. It holds the sender's
# own key pair, so reminders need no secrets set by hand; Tell GI Hub needs
# two, below.
name = "gi-hub-agenda"
main = "worker.mjs"
compatibility_date = "2026-10-01"
workers_dev = true
preview_urls = false

# Every minute: whatever reminders fell due in it.
[triggers]
crons = ["* * * * *"]

[[kv_namespaces]]
binding = "AGENDA"
id = "1617987c74a74688baf3169e5b0c9c53"

# Tell GI Hub's inbox (tell.mjs): a Durable Object on SQLite storage, which the
# free plan allows. The Claude task's start address and token are secrets the
# user sets once from this folder: npx wrangler secret put TASK_URL, then
# npx wrangler secret put TASK_TOKEN (TELL-SETUP.md).
[[durable_objects.bindings]]
name = "TELL"
class_name = "Tell"

[[migrations]]
tag = "tell-v1"
new_sqlite_classes = ["Tell"]
