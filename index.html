<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GI Hub</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="GI Hub">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#064e3b">
<style>
:root{
  --bg:#0b100e; --card:#151d19; --text:#e6ebe8; --muted:#93a39b; --border:#25302a;
  --accent:#34d399; --accent-ink:#6ee7b7; --accent-weak:#0e3a2b; --danger:#f87171;
  --chipbg:#0d4a37; --chiptx:#a7f3d0;
}
:root{color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);
  font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  padding-bottom:env(safe-area-inset-bottom)}
#app{max-width:560px;margin:0 auto;padding:0 14px 40px}
button{font:inherit;color:inherit;background:none;border:none;padding:0;text-align:left;cursor:pointer}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);
  padding:calc(10px + env(safe-area-inset-top)) 2px 8px}
.htitle{display:flex;justify-content:space-between;align-items:baseline}
.htitle b{font-size:20px;letter-spacing:-.2px}
.hcount{font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.hbar{height:5px;border-radius:3px;background:var(--border);margin-top:8px;overflow:hidden}
.hbar i{display:block;height:100%;background:var(--accent);border-radius:3px}
section{margin-top:18px}
section h2{font-size:12px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:0 2px 8px}
.row{display:flex;gap:12px;align-items:center;width:100%;min-height:56px;
  background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:10px 12px;margin-bottom:8px}
.row:active{transform:scale(.99)}
.code{flex:0 0 44px;height:44px;border-radius:11px;background:var(--chipbg);color:var(--chiptx);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px}
.rmid{flex:1;min-width:0}
.rtitle{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;
  font-size:13.5px;line-height:1.3;color:var(--text)}
.rbar{display:block;height:4px;border-radius:2px;background:var(--border);margin-top:6px;overflow:hidden}
.rbar i{display:block;height:100%;background:var(--accent);border-radius:2px}
.rcount{flex:0 0 auto;font-variant-numeric:tabular-nums;font-weight:650;color:var(--muted);font-size:14px}
.rcount.done{color:var(--accent-ink)}
.banner{background:var(--accent-weak);border:1px solid var(--accent);border-radius:14px;
  padding:12px 14px;margin-top:10px}
.banner b{font-size:15px}
.bhint{font-size:13px;color:var(--muted);margin-top:3px;line-height:1.4}
.strip{display:flex;gap:8px;overflow-x:auto;padding:10px 2px 2px;-webkit-overflow-scrolling:touch;scrollbar-width:none}
.strip::-webkit-scrollbar{display:none}
.mini{flex:0 0 auto;min-width:74px;min-height:44px;background:var(--card);border:1px solid var(--border);
  border-radius:12px;padding:8px 12px;text-align:center}
.mini b{display:block;font-size:15px;color:var(--accent-ink)}
.mini span{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.chip{display:inline-block;background:var(--accent);color:#06281c;border-radius:99px;
  font-size:10px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;
  padding:2px 7px;margin-left:6px;vertical-align:2px}
.back{color:var(--accent-ink);font-weight:650;min-height:44px;display:flex;align-items:center}
.dhead{display:flex;gap:10px;align-items:center;margin-top:2px}
.code.big{flex:0 0 52px;height:52px;font-size:18px;border-radius:13px}
.stagechip{font-size:12px;color:var(--muted);border:1px solid var(--border);border-radius:99px;padding:3px 10px}
.dtitle{font-size:19px;line-height:1.3;margin:10px 0 4px;letter-spacing:-.2px}
.part{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:14px;margin-top:14px}
.part h3{margin:0 0 6px;font-size:15px}
.pprog{font-size:14px;color:var(--muted)}
.pprog b{font-size:20px;color:var(--text)}
.pprog .ok{color:var(--accent-ink);font-weight:650}
.pbarBig{height:6px;border-radius:3px;background:var(--border);margin:8px 0 10px;overflow:hidden}
.pbarBig i{display:block;height:100%;background:var(--accent);border-radius:3px}
.logbtn{display:flex;align-items:center;justify-content:center;width:100%;min-height:46px;
  border:1.5px dashed var(--accent);border-radius:12px;color:var(--accent-ink);font-weight:650}
.obsrow{display:flex;gap:10px;align-items:center;width:100%;min-height:44px;
  border-bottom:1px solid var(--border);padding:6px 2px;font-size:14px}
.obsrow .onum{color:var(--accent-ink);font-weight:700;flex:0 0 28px}
.obsrow .ometa{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.editor{background:var(--bg);border:1px solid var(--border);border-radius:12px;padding:10px;margin:8px 0}
.editor label{display:block;font-size:12px;color:var(--muted);margin-bottom:8px}
.editor input{display:block;width:100%;margin-top:3px;font:inherit;color:var(--text);
  background:var(--card);border:1px solid var(--border);border-radius:8px;padding:9px 10px;min-height:40px}
.erow{display:flex;justify-content:space-between;gap:10px}
.erow button{min-height:40px;padding:0 16px;border-radius:10px;font-weight:650}
.erow .del{color:var(--danger)}
.erow .donebtn{background:var(--accent);color:#06281c}
.ctx{margin-top:12px}
.ctx h4{margin:0 0 4px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.ihead{font-size:13px;font-weight:650;color:var(--muted);padding:10px 2px 2px}
.line{display:flex;gap:10px;align-items:center;min-height:46px;border-bottom:1px solid var(--border);
  padding:4px 2px;cursor:pointer}
.line:last-child{border-bottom:none}
.lbox{flex:0 0 30px;height:30px;border:1.5px solid var(--border);border-radius:9px;
  display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:var(--accent-ink)}
.ldone .lbox{background:var(--accent);border-color:var(--accent);color:#06281c}
.llab{flex:1;font-size:14px;line-height:1.3}
.ldone .llab{color:var(--muted);text-decoration:line-through}
.lmeta{flex:0 0 36px;height:36px;border-radius:9px;color:var(--muted);
  display:flex;align-items:center;justify-content:center;font-weight:700}
.refblock{margin-top:18px}
.refblock h4{margin:16px 0 6px;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.refblock ul{margin:0;padding-left:18px;font-size:14px;color:var(--text)}
.refblock li{margin-bottom:6px;line-height:1.45}
.planitem{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:11px 13px;margin-bottom:8px;font-size:14px}
.planitem b{display:block;margin-bottom:2px}
.planitem .rule{color:var(--accent-ink);font-weight:600;margin-top:6px}
.planitem .meth{color:var(--muted)}
details{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:0 13px;margin-top:10px}
summary{min-height:46px;display:flex;align-items:center;font-weight:650;cursor:pointer;list-style:none}
summary::before{content:"▸";margin-right:8px;color:var(--accent-ink);transition:transform .15s}
details[open] summary::before{transform:rotate(90deg)}
details ol{margin:0 0 12px;padding-left:20px;font-size:13.5px}
details li{margin-bottom:7px;line-height:1.45}
details h5{margin:8px 0 6px;font-size:13px;color:var(--muted)}
.nudge{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--accent);
  border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13.5px}
.nudge .dis{flex:0 0 36px;height:36px;color:var(--muted);display:flex;align-items:center;justify-content:center;font-size:17px}
.warnbar{background:var(--danger);color:#fff;border-radius:12px;padding:10px 12px;margin-top:10px;font-size:13.5px;font-weight:600}
.bwrap{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px}
.bbtn{display:flex;align-items:center;justify-content:center;width:100%;min-height:46px;
  border:1px solid var(--border);border-radius:11px;font-weight:650;margin-bottom:8px;color:var(--accent-ink)}
.bnote{font-size:12.5px;color:var(--muted);text-align:center}
.berr{color:var(--danger);font-size:13px;margin-top:6px;text-align:center}
.copy{font-size:11px;color:var(--muted);line-height:1.4;margin-top:14px}
.tabs{display:flex;background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:3px;margin-top:10px}
.tab{flex:1;min-height:40px;display:flex;align-items:center;justify-content:center;
  border-radius:9px;font-weight:650;color:var(--muted)}
.tab.active{background:var(--accent);color:#06281c}
.goal{font-size:13px;color:var(--muted);margin:12px 2px 2px;line-height:1.4}
.goal b{color:var(--accent-ink)}
.pcard{background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:13px 14px;margin-top:12px}
.pcard.now{border-color:var(--accent);background:var(--accent-weak)}
.pcard.past{opacity:.55}
.pctop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.pctop b{font-size:15px}
.pcdates{font-size:12px;color:var(--muted);white-space:nowrap}
.nowchip{background:var(--accent);color:#06281c;border-radius:99px;font-size:10px;
  font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:2px 8px}
.pcload{font-size:12px;color:var(--muted)}
.pchips{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.pchip{min-height:36px;display:flex;align-items:center;gap:5px;background:var(--bg);
  border:1px solid var(--border);border-radius:10px;padding:4px 11px;font-size:13px}
.pchip b{color:var(--accent-ink)}
.pchip span{color:var(--muted);font-variant-numeric:tabular-nums}
.pchip.full{border-color:var(--accent)}
.pchip.full b{text-decoration:line-through;color:var(--muted)}
:root{--tag2:#f0a63c; --mark:#3a4a2a}
.bsub{font-size:11px;color:var(--muted);margin:2px 2px 10px}
.qwrap{position:relative;margin-top:2px}
#biopsyq{width:100%;padding:13px 40px 13px 14px;font-size:17px;border-radius:12px;
  border:1px solid var(--border);background:var(--card);color:var(--text);outline:none}
#biopsyq:focus{border-color:var(--accent)}
.qclear{position:absolute;right:6px;top:50%;transform:translateY(-50%);border:none;background:var(--chipbg);
  color:var(--chiptx);width:30px;height:30px;border-radius:50%;font-size:16px}
.bcats{display:flex;gap:7px;overflow-x:auto;padding:10px 2px 2px;scrollbar-width:none}
.bcats::-webkit-scrollbar{display:none}
.bcat{white-space:nowrap;min-height:38px;display:flex;align-items:center;padding:7px 14px;border-radius:999px;
  font-size:13px;font-weight:600;background:var(--card);border:1px solid var(--border);color:var(--muted)}
.bcat.on{background:var(--accent);color:#06281c;border-color:var(--accent)}
.bcount{color:var(--muted);font-size:12px;padding:9px 4px 0}
.bgrp{font-size:12px;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--muted);margin:16px 4px 8px}
.bcard{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:13px 14px;margin-bottom:10px}
.bcard h3{font-size:16px;margin:0 0 8px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;line-height:1.3}
.btag{font-size:10px;font-weight:700;padding:2px 7px;border-radius:6px;letter-spacing:.3px}
.btag.mb{background:var(--accent-weak);color:var(--accent-ink)}
.btag.us{background:color-mix(in srgb,var(--tag2) 24%,transparent);color:var(--tag2)}
.brow{display:flex;gap:9px;padding:6px 0;font-size:14.5px;border-top:1px solid var(--border)}
.brow:first-of-type{border-top:none}
.bk{flex:0 0 82px;color:var(--muted);font-weight:600;font-size:12.5px;padding-top:1px}
.bv{flex:1;line-height:1.4}
.bv b{color:var(--accent-ink);font-weight:700}
.bv.note{color:var(--muted);font-size:13.5px}
.bcard mark{background:var(--mark);color:inherit;border-radius:3px;padding:0 1px}
.bempty{color:var(--muted);text-align:center;padding:40px 20px;font-size:15px}
.bfoot{color:var(--muted);font-size:11px;text-align:center;padding:22px 12px 0;line-height:1.6}
</style>
</head>

    const i = Store.logObs(d.part);
    Store.setObsMeta(d.part, i, {d: fmtDate(window.__today || new Date())});
    route.editObs = d.part + "|" + i; route.editLine = null; route.keepScroll = true; render(); }
  else if (act === "editobs") {
    const k = d.part + "|" + d.obs;
    route.editObs = route.editObs === k ? null : k; route.editLine = null; route.keepScroll = true; render(); }
  else if (act === "delobs") { Store.removeObs(d.part, +d.obs); route.editObs = null; route.keepScroll = true; render(); }
  else if (act === "cycleline") { Store.cycleLine(d.line, +d.target); route.keepScroll = true; render(); }
  else if (act === "linemeta") {
    route.editLine = route.editLine === d.line ? null : d.line; route.editObs = null; route.keepScroll = true; render(); }
  else if (act === "closeedit") { route.editObs = null; route.editLine = null; route.keepScroll = true; render(); }
  else if (act === "dismissnudge") { nudgeDismissed = true; route.keepScroll = true; render(); }
  else if (act === "export") {
    const json = Store.exportJSON();
    const a = document.createElement("a");
    a.href = URL.createObjectURL(new Blob([json], {type:"application/json"}));
    a.download = "epa-backup-" + fmtDate(new Date()) + ".json";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    route.keepScroll = true; render(); }
  else if (act === "importpick") { document.getElementById("importfile").click(); }
  else if (act === "bcat") { biopsyCat = d.cat; route.keepScroll = true; render(); }
  else if (act === "bclear") { biopsyTerm = ""; route.keepScroll = true; render();
    const q = document.getElementById("biopsyq"); if (q) q.focus(); }
}
document.getElementById("app").addEventListener("click", ev => {
  const t = ev.target.closest("[data-action]");
  if (t) dispatch(t.dataset.action, t.dataset);
});
document.getElementById("app").addEventListener("input", ev => {
  if (ev.target.id !== "biopsyq") return;
  const caret = ev.target.selectionStart;
  biopsyTerm = ev.target.value;
  route.keepScroll = true;
  render();
  const q = document.getElementById("biopsyq");
  if (q) { q.focus(); try { q.setSelectionRange(caret, caret); } catch(e){} }
});
document.getElementById("app").addEventListener("change", ev => {
  const t = ev.target, d = t.dataset || {};
  if (t.id === "importfile") {
    const f = t.files && t.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => {
      importError = null;
      if (confirm("Replace current progress with this backup?")) {
        const res = Store.importJSON(rd.result);
        if (!res.ok) importError = res.error;
      }
      render();
    };
    rd.readAsText(f);
    return;
  }
  if (!d.field) return;
  if (d.part !== undefined && d.obs !== undefined) Store.setObsMeta(d.part, +d.obs, {[d.field]: t.value});
  else if (d.line) Store.setLineMeta(d.line, {[d.field]: t.value});
});
Store.load();
render();
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js");
</script>
